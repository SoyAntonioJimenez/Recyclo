name: Build y release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Compilar
        run: dotnet build -c Release

      - name: Publicar autocontenido
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/selfcontained

      - name: Publicar ligero
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o dist/light

      - name: Renombrar artefactos
        shell: pwsh
        run: |
          Move-Item dist/selfcontained/RecycloTray.exe dist/RecycloTray.exe -Force
          Move-Item dist/light/RecycloTray.exe dist/RecycloTray-net.exe -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RecycloTray
          path: dist/*.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RecycloTray.exe
            dist/RecycloTray-net.exe
          generate_release_notes: true

